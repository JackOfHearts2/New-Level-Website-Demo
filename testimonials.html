<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Testimonials · New Level</title>
  <meta name="description" content="What clients say about working with New Level.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=DM+Sans:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="testimonials">

  <div class="demo-banner"><b>DEMO BUILD</b> — not live.</div>

  <div class="nav">
    <div class="wrap nav__inner">
      <div class="nav__left">
        <a class="nav__back" href="index.html">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          Back to New Level
        </a>
      </div>
      <a class="brand nav__brand" href="index.html" aria-label="New Level — home">
        <span class="brand__logo-slot" id="navMark"></span>
      </a>
      <div class="nav__right">
        <label class="nav__lang" aria-label="Language">
          <span class="nav__lang-ic" aria-hidden="true"></span>
          <select class="lang-select" aria-label="Language"></select>
        </label>
      </div>
    </div>
  </div>

  <section class="section">
    <div class="wrap">
      <div class="section__head" style="text-align:center;margin-inline:auto;max-width:760px">
        <span class="eyebrow" style="justify-content:center" id="pageEyebrow">Testimonials</span>
        <h1 class="h-xl" style="margin-top:14px" id="pageHeading">What clients say.</h1>
        <p class="lede muted" style="margin-top:10px" id="pageSub"></p>
      </div>

      <div class="carousel" id="testimonialsCarousel">
        <button class="carousel__arrow carousel__arrow--prev" id="testimonialsPrev" type="button" aria-label="Previous">&lsaquo;</button>
        <div class="carousel__track" id="testimonialsGrid"></div>
        <button class="carousel__arrow carousel__arrow--next" id="testimonialsNext" type="button" aria-label="Next">&rsaquo;</button>
      </div>
    </div>
  </section>

  <section class="section section--alt">
    <div class="wrap">
      <div class="section__head">
        <span class="eyebrow">Guest reviews</span>
        <h2 class="h-lg" style="margin-top:14px">From guests at 1331 NW 87th Street.</h2>
        <p class="muted" style="margin-top:8px">Property-specific reviews live on the property page, alongside how-it-works details.</p>
      </div>
      <a class="btn btn--solid" href="property.html#reviews">See guest reviews &rsaquo;</a>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="section__head" style="text-align:center;margin-inline:auto">
        <span class="eyebrow" style="justify-content:center">Keep exploring</span>
        <h2 class="h-lg" style="margin-top:14px">More New Level.</h2>
      </div>
      <nav class="cross-nav__links" id="crossNavLinks" aria-label="More New Level pages"></nav>
    </div>
  </section>

  <footer class="site-footer" id="siteFooter"></footer>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
