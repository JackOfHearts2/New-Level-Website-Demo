[build]
  command = "npm run build"
  # The Netlify UI had this site's publish directory set to "web" — the same
  # as its base directory — which @netlify/plugin-nextjs rejects outright
  # ("publish directory cannot be the same as the base directory"). Setting
  # it explicitly here (resolved relative to base, so web/.next) overrides
  # that UI value and points at the actual Next.js build output instead.
  publish = ".next"

# Without this, Netlify has no way to understand a Next.js build's output —
# it just publishes the raw source as static files, so every route 404s.
# This was silently broken since the site's first deploy (see git history);
# framework auto-detection apparently didn't attach the plugin on its own
# for this site, so it's declared explicitly here instead of relied on.
[[plugins]]
  package = "@netlify/plugin-nextjs"
