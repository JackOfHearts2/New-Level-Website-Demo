[build]
  command = "npm run build"
  # The Netlify UI had this site's publish directory set to "web" — the same
  # as its base directory — which @netlify/plugin-nextjs rejects outright
  # ("publish directory cannot be the same as the base directory"). Setting
  # it explicitly here (resolved relative to base, so web/.next) overrides
  # that UI value and points at the actual Next.js build output instead.
  publish = ".next"

# Without this, Netlify has no way to understand a Next.js build's output —
# it just publishes the raw source as static files, so every route 404s.
# This was silently broken since the site's first deploy (see git history);
# framework auto-detection apparently didn't attach the plugin on its own
# for this site, so it's declared explicitly here instead of relied on.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Baseline security headers - site audit finding: none of these existed
# before (Netlify/Next already add a couple of basics like HSTS and
# X-Content-Type-Options automatically, confirmed via a live response
# check, but nothing here overlaps those). Deliberately NOT adding a
# Content-Security-Policy here: this app loads Google Fonts, talks to
# Supabase, and layout.tsx injects an inline script for the theme toggle
# (dangerouslySetInnerHTML, needed to run before paint) - a CSP strict
# enough to matter would need careful nonce wiring and real testing
# against every page before shipping, which isn't safe to do blind.
[[headers]]
  for = "/*"
  [headers.values]
    # Clickjacking protection - matters concretely here since /admin/login
    # is a real password form; without this, the login page could be
    # framed on an attacker's page to trick a click.
    X-Frame-Options = "DENY"
    # Don't leak full URLs (including any query params) to external sites
    # when a visitor clicks an outbound link.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Explicitly deny browser features this site has no use for.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
