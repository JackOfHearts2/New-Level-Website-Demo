<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Contact · New Level</title>
  <meta name="description" content="Get in touch with New Level — a South Florida real estate group.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=DM+Sans:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="contact">

  <div class="demo-banner"><b>DEMO BUILD</b> — not live.</div>

  <div class="nav">
    <div class="wrap nav__inner">
      <div class="nav__left">
        <a class="brand nav__brand" href="index.html" aria-label="New Level — home">
          <span class="brand__logo-slot" id="navMark"></span>
        </a>
      </div>
      <div class="nav__right">
        <a class="nav__back" href="index.html">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          Back to New Level
        </a>
        <nav class="nav__links" id="navLinks" aria-label="Primary"></nav>
        <label class="nav__lang" aria-label="Language">
          <span class="nav__lang-ic" aria-hidden="true"></span>
          <select class="lang-select" aria-label="Language"></select>
        </label>
      </div>
    </div>
  </div>

  <section class="section">
    <div class="wrap">
      <div class="section__head" style="text-align:center;margin-inline:auto;max-width:640px">
        <span class="eyebrow" style="justify-content:center" id="pageEyebrow">Contact</span>
        <h1 class="h-xl" style="margin-top:14px" id="pageHeading">Get in touch</h1>
        <p class="lede muted" style="margin-top:10px" id="pageSub"></p>
      </div>
      <p class="lede" id="pageIntro" style="max-width:640px;margin:0 auto;text-align:center"></p>
    </div>
  </section>

  <!-- point of contact + WhatsApp (same component as the property page) -->
  <section class="agentbar">
    <div class="wrap agentbar__inner">
      <div class="agentbar__who">
        <div class="agentbar__avatar" data-agent-initials>SL</div>
        <div>
          <div class="agentbar__name" data-agent-name>Point of Contact</div>
          <div class="agentbar__role" data-agent-role>New Level</div>
          <div class="agentbar__role"><a data-agent-phone href="#" style="color:#fff;text-decoration:none">Phone</a></div>
          <div class="agentbar__role"><a id="contactEmail" href="#" style="color:#fff;text-decoration:none">Email</a></div>
        </div>
      </div>
      <div class="agentbar__actions">
        <a class="btn btn--wa" data-wa href="#" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.004c5.46 0 9.91-4.45 9.91-9.91C21.95 6.45 17.5 2 12.04 2Zm5.8 14.16c-.24.68-1.42 1.32-1.95 1.36-.5.04-.98.22-3.3-.69-2.78-1.1-4.56-3.94-4.7-4.12-.14-.18-1.13-1.5-1.13-2.87 0-1.36.72-2.03.97-2.31.25-.28.55-.35.73-.35.18 0 .37 0 .53.01.17.01.4-.06.62.48.24.55.8 1.9.87 2.04.07.14.11.3.02.48-.09.18-.14.29-.27.45-.14.16-.29.36-.41.48-.14.14-.28.29-.12.57.16.28.71 1.17 1.53 1.9 1.05.94 1.94 1.23 2.22 1.37.28.14.44.12.6-.07.18-.2.69-.8.87-1.08.18-.28.36-.23.6-.14.25.09 1.57.74 1.84.87.27.14.45.2.51.32.07.11.07.66-.17 1.34Z"/></svg>
          WhatsApp us
        </a>
        <a class="btn btn--onwhite" data-agent-phone href="#">Call us</a>
      </div>
    </div>
  </section>

  <section class="section section--alt">
    <div class="wrap">
      <div class="section__head" style="text-align:center;margin-inline:auto">
        <span class="eyebrow" style="justify-content:center">Keep exploring</span>
        <h2 class="h-lg" style="margin-top:14px">More New Level.</h2>
      </div>
      <nav class="cross-nav__links" id="crossNavLinks" aria-label="More New Level pages"></nav>
    </div>
  </section>

  <footer class="site-footer" id="siteFooter"></footer>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
